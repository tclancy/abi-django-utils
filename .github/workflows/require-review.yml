name: Require Code Review

# Issue #24, second half. The first half (`claude-code-review.yml`) PRODUCES a
# review; this publishes a commit status saying whether one exists for the
# CURRENT head, so a PR that has not been reviewed reads red instead of reading
# exactly like a reviewed one.
#
# WHY BOTH HALVES AND NOT JUST THE REVIEWER. This repo has no
# `CLAUDE_CODE_OAUTH_TOKEN` and the bot App cannot add one, so the reviewer
# ships as a clean green no-op. A `claude-review` check that goes green having
# done nothing renders identically to a passing review (metaframework#777) --
# which would leave this repo looking gated while grading nothing, the exact
# state #24 was filed about. This half is what makes the unprovisioned state
# visible: `pending`, naming the owner and the remedy.
#
# WHY A COMMIT STATUS AND NOT THIS JOB'S OWN CHECK. A check-run attaches to the
# SHA of the event that triggered it. An `issue_comment` run executes in the
# default-branch context, so its implicit check lands on `main`'s tip and never
# touches the PR head -- which is the whole mechanism behind metaframework#620.
# Posting to `repos/.../statuses/<head sha>` targets the PR head from either
# trigger. This job therefore always succeeds; the verdict is the status.
#
# WHY NOT VENDOR metaframework's `review_gate.py`. It is 668 lines and lives in
# a PRIVATE repo, so this public repo's `github.token` cannot read it
# cross-repo and `actions/checkout` with no `repository:` would look for
# `abi-django-utils/src/dispatch/review_gate.py` and find nothing. The decision
# here is `.github/review-gate.jq` -- a pure jq function, unit-tested by
# `tests/test_review_gate.py`, with `jq` and `gh` both preinstalled on
# `ubuntu-latest`, so this job needs no language runtime and no dependency
# install.
#
# NOT A MERGE BLOCK. Measured 2026-10-25: `gh api repos/.../rulesets` returns
# `[]` on this repo. (Branch protection itself is not readable here -- the bot
# App gets 403 on `branches/main/protection` -- so this is "no rulesets", not
# "nothing could block". An earlier draft of this paragraph said protection is
# unavailable on GitHub Free; that is a statement about PRIVATE repos and this
# repo is public, where Free does offer it.) The red X is backpressure for
# autonomous agents, which is what the rollout asked for.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    # `edited` as well as `created`, and that is a consequence of the gate's
    # own rule rather than a nicety. `.github/review-gate.jq` only counts a bot
    # comment once its progress checklist has no outstanding `- [ ]` items, and
    # `track_progress: true` posts that checklist unticked and EDITS it to
    # completion in place. On `created` alone the gate could never observe the
    # boxes get ticked. The cost is one run per edit during a live review; they
    # are seconds, and this repo is public, where Actions minutes are free.
    types: [created, edited]
  # A formal APPROVED / CHANGES_REQUESTED satisfies the gate -- it is how Tom
  # satisfies it himself -- but it arrives as `pull_request_review`, not as an
  # `issue_comment`. Without this, approving a PR yourself leaves the red X
  # sitting there (metaframework had the same bug).
  pull_request_review:
    types: [submitted]

concurrency:
  group: require-review-${{ github.event.pull_request.number || github.event.issue.number }}
  # MUST stay false. GitHub paints a *cancelled* run red on the PR even when
  # the authoritative status this workflow publishes is green, which is what
  # made three metaframework PRs read UNSTABLE with every real check passing
  # (metaframework#511). The concurrency group still serialises, so two runs
  # never race to write the same commit status, and a run still pending when a
  # newer one queues is dropped -- which is what bounds the `edited` burst.
  cancel-in-progress: false

jobs:
  require-review:
    # For `issue_comment`, only run when the comment could change the answer:
    # the review bot posting or ticking its own comment (the self-heal path), or
    # anyone asking for `/review`. Ordinary human discussion is skipped.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (github.event.comment.user.login == 'claude[bot]' ||
        contains(github.event.comment.body, '/review')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      # Only the one file. No dependency install, no language setup: the gate
      # is a jq program and `ubuntu-latest` ships jq and gh already.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/review-gate.jq
          sparse-checkout-cone-mode: false

      - name: Resolve PR number and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # `issue_comment` carries no pull_request object, so the head SHA has
          # to be looked up. `pull_request` and `pull_request_review` both have
          # it.
          #
          # Every value arrives through `env:` above rather than being
          # interpolated into this script by a GitHub expression. A PR title or
          # comment body spliced straight into shell is a command-injection
          # surface, and one of the fields read here IS the PR title.
          #
          # And an expression in a `run:` body is not inert even in a COMMENT:
          # GitHub evaluates them before the shell ever sees the script, so a
          # commented-out one is still parsed, and a malformed one makes the
          # whole workflow file invalid. That failure is near-silent -- a run
          # with zero jobs, no annotation and no log, which `check-yaml` and
          # workflow linters all pass. `tests/test_review_gate.py` bans the
          # expression delimiters from every `run:` block in both workflows,
          # which is the same rule the paragraph above asks for anyway.
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            number="$ISSUE_NUMBER"
            sha="$(gh api "repos/${REPO}/pulls/${number}" --jq .head.sha)"
          else
            number="$PR_NUMBER"
            sha="$PR_HEAD_SHA"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Skip cross-repository PRs. Two reasons, and only the first is a
      # token limitation:
      #
      #   1. On the `pull_request` trigger a fork PR's `GITHUB_TOKEN` is
      #      read-only, so the `statuses: write` declared above is NOT granted
      #      and the POST below would 403 -- turning every outside
      #      contribution into a red *workflow* run, which is worse than no
      #      gate. This repo is PUBLIC, so that is a live shape.
      #   2. On `issue_comment` and `pull_request_review` the job runs in the
      #      base-repo context and the token IS writable, so the status could
      #      be posted. Skipping those is a POLICY choice, not a limitation:
      #      the reviewer declines fork PRs too (it cannot post inline
      #      comments back across the boundary), so a status demanding a
      #      review nothing will perform is a red X with no remedy. The known
      #      consequence: a maintainer who types `/review` on an outside PR
      #      gets a real review and no status to show for it.
      #
      # Outside contributions get Tom's own review; this gate is backpressure
      # on agent PRs.
      #
      # THE DISCRIMINATOR IS `head.repo.full_name`, NOT `head.repo.fork`. See
      # the long note on the same question in `claude-code-review.yml`.
      - name: Is this a cross-repository PR?
        id: fork
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            head_repo="$HEAD_REPO"
          else
            head_repo="$(gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.head.repo.full_name')"
          fi
          # A DELETED head repo reports the literal string `null`, which is
          # not `$REPO`, so it lands in the cross-repo branch and is skipped --
          # the safe direction. Note the narrow scope of that claim: under
          # `set -euo pipefail` an `gh api` *failure* kills this step rather
          # than falling back to anything, and the `if: failure()` step at the
          # end of this job is what publishes a verdict in that case.
          if [ "$head_repo" = "$REPO" ]; then
            fork=false
          else
            fork=true
          fi
          echo "fork=${fork}" >> "$GITHUB_OUTPUT"
          # An `if`, not `[ ... ] && echo`: under `set -e` a false test makes
          # the whole AND-list exit 1 and takes the step down with it, so the
          # same-repo case -- the common one -- would fail the job.
          if [ "$fork" = "true" ]; then
            echo "::notice::Cross-repository PR (head ${head_repo}) - review gate skipped; its token cannot write a commit status."
          fi

      - name: Evaluate the gate and publish the status to the PR head
        if: steps.fork.outputs.fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Read by the unprovisioned branch at the END of the step below --
          # the ordering is load-bearing and the reasoning is at the branch.
          REVIEWER_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          publish() {
            gh api -X POST "repos/${REPO}/statuses/${SHA}" \
              -f state="$1" \
              -f context="dispatch/require-review" \
              -f description="$2" \
              -f target_url="${RUN_URL}" >/dev/null
            printf 'dispatch/require-review = %s: %s\n' "$1" "$2"
          }

          # Publish `error` rather than nothing if anything below blows up.
          # Without this the step just dies under `set -e` and NO status is
          # posted -- so the PR silently keeps whatever status it already had,
          # which on a re-evaluation of an approved-then-pushed PR is a stale
          # GREEN. A gate's failure mode must not be "leave the last verdict
          # standing". `trap` fires on the non-zero exit; `publish` is defined
          # above it, and the `|| true` keeps a failing publish from recursing.
          trap 'publish error "Gate could not be evaluated - see the run log. This is a gate failure, not a review verdict." || true' ERR

          # `--paginate` without `--jq` emits one JSON array PER PAGE, which is
          # not a single document. `--jq '.[]'` streams the objects and `jq -s`
          # reassembles them into one array, so this is page-count-independent.
          gh api "repos/${REPO}/issues/${NUMBER}/comments" --paginate --jq '.[]' | jq -s '.' > comments.json
          gh api "repos/${REPO}/pulls/${NUMBER}/reviews"   --paginate --jq '.[]' | jq -s '.' > reviews.json
          gh api "repos/${REPO}/pulls/${NUMBER}" > pr.json
          gh api "repos/${REPO}/commits/${SHA}" > head.json

          # `--slurpfile`, not `--argjson "$(cat ...)"`: a PR body or a review
          # comment can be long, and routing the whole document through argv
          # puts it under ARG_MAX and through another layer of shell quoting
          # for no gain. Each `$name` is an ARRAY of the file's documents,
          # hence `[0]`.
          jq -n \
            --slurpfile pr       pr.json \
            --slurpfile head     head.json \
            --slurpfile comments comments.json \
            --slurpfile reviews  reviews.json \
            '{ number: $pr[0].number,
               author: $pr[0].user.login,
               title:  $pr[0].title,
               # The committer date of the HEAD commit. `review_gate.py` instead
               # takes `max()` over every commit in `pulls/N/commits`, to drop
               # the assumption that the head is the newest -- so this is NOT
               # parity with it, and the difference is real if a push lands
               # commits out of date order (rebase, cherry-pick). The trade is
               # deliberate: `commits/{SHA}` is exact for the SHA the status is
               # posted to and has no 250-commit page cap, where the list
               # endpoint has both. If a reviewed-then-reordered PR ever reads
               # fresh here, this line is why.
               head_committed_at: $head[0].commit.committer.date,
               bot_logins: ["claude[bot]"],
               reviewer_logins: ["tclancy"],
               comments: $comments[0],
               reviews: $reviews[0] }' > gate-input.json

          verdict="$(jq -f .github/review-gate.jq gate-input.json)"
          state="$(printf '%s' "$verdict" | jq -r .state)"
          description="$(printf '%s' "$verdict" | jq -r .description)"

          # THE PROVISIONING CHECK IS DOWNSTREAM OF THE VERDICT, AND THAT
          # ORDERING IS THE FIX FOR A REAL BUG -- found in review on
          # parsons-remote PR #26, which was cut from this file.
          #
          # Layer 0 (see the `claude-code-action-review-gate` skill): an unset
          # secret interpolates to the empty string, which is how the gate
          # learns the reviewer cannot run at all. The bot App 403s on
          # `actions/secrets`, so until Tom adds one the gate would otherwise
          # be a permanent red X with no remedy available to anyone but him.
          # `pending` instead: visibly not-green, not a false pass, and it
          # names the owner and the remedy.
          #
          # This branch USED to sit above the evaluation and `exit 0` out of
          # it. A Dependabot `pull_request` event is served from GitHub's
          # SEPARATE Dependabot secret store, so this variable is empty on it
          # even once the repo secret exists -- so every Dependabot PR
          # published `pending` and told the reader to add a secret that was
          # already there, instead of the `success` /"Review not required:
          # Dependabot PR" that `review-gate.jq`'s own `exempt_reason` returns
          # for it. This repo has a `.github/dependabot.yml`, so that was a
          # live shape. The same ordering also overrode a genuine fresh review
          # on any event where the secret is not visible.
          #
          # AN EXEMPTION MUST NEVER SIT DOWNSTREAM OF A PROVISIONING CHECK.
          # Reading `$state` first is what makes `pending` reachable only when
          # the gate has nothing better to say.
          if [ "$state" != "success" ] && [ -z "${REVIEWER_TOKEN}" ]; then
            # The description is capped at 140 characters by GitHub, so it
            # names the first step only; the notice carries both. The second
            # step is easy to miss and is just as load-bearing: this gate
            # matches on the login `claude[bot]`, which exists only if the
            # Claude GitHub App is installed on this repo. Secret without App
            # => the reviewer's comments post under a different login, the
            # gate never matches, and the PR sits red with a remedy that
            # cannot work.
            echo "::notice::Review gate not provisioned. Two steps, both Tom's: (1) add the CLAUDE_CODE_OAUTH_TOKEN repo secret; (2) install the Claude GitHub App on this repo, so the reviewer posts as claude[bot] - this gate matches on that login."
            publish pending \
              "Not provisioned for this event: no CLAUDE_CODE_OAUTH_TOKEN visible, so the reviewer cannot run. Dependabot uses a separate secret store."
            exit 0
          fi

          publish "$state" "$description"

      # A GATE FAILURE MUST NOT LEAVE THE LAST VERDICT STANDING, and the
      # `trap` above is installed inside the publish step -- so a `gh api`
      # failure in *Resolve PR number and head SHA* or *Is this a
      # cross-repository PR?* fails the job without reaching it, leaving the
      # head's PREVIOUS status in place. On a re-evaluation of an
      # already-green head (a `/review` comment, a dismissed review) that is a
      # stale GREEN. This step closes the invariant for the whole job.
      #
      # ITS CONDITION USED TO READ `&& steps.pr.outputs.sha != ''`, WHICH
      # DISARMED IT IN EXACTLY THE CASE IT WAS ADDED FOR. When the resolution
      # step is the one that died its output is empty, the condition is false,
      # and no verdict is published -- which is the whole scenario the
      # paragraph above describes. The reasoning for the guard ("there is
      # nowhere to post a status if the resolution step is what died") was
      # wrong twice over: `pull_request` and `pull_request_review` both carry
      # the head SHA in the event payload, and for `issue_comment` the API
      # lookup can simply be retried here. So this step resolves a SHA for
      # itself and warns if it cannot, rather than being skipped.
      #
      # The fork check IS still honoured -- a cross-repository PR's token
      # cannot write a commit status, so attempting one is a guaranteed 403 in
      # the log. Note that it reads `!= 'true'`, so it also passes when the
      # fork step is itself the step that failed and its output is empty.
      #
      # `set -uo pipefail` and not `-euo`: a fallback step that aborts on its
      # own first error is not a fallback. Every command that may legitimately
      # fail here carries `|| true` and is tested for an empty result.
      - name: A failure anywhere above must not leave a stale verdict standing
        if: failure() && steps.fork.outputs.fork != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            number="$ISSUE_NUMBER"
          else
            number="$PR_NUMBER"
            sha="$PR_HEAD_SHA"
          fi
          if [ -z "${sha:-}" ]; then
            sha="$(gh api "repos/${REPO}/pulls/${number}" --jq .head.sha || true)"
          fi
          if [ -z "${sha:-}" ]; then
            echo "::warning::Could not resolve a head SHA, so no status could be published. The PR keeps whatever status it already had - read it as unverified."
            exit 0
          fi
          gh api -X POST "repos/${REPO}/statuses/${sha}" \
            -f state=error \
            -f context="dispatch/require-review" \
            -f description="Gate failed before it could evaluate - see the run log. Not a review verdict." \
            -f target_url="${RUN_URL}" >/dev/null || true
