[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abi-django-utils"
version = "0.1.0"
description = "Shared Django utilities for Tom Clancy's projects (A Better Internet pattern library)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "django>=4.2",
    "whitenoise>=6.0",
]

[project.optional-dependencies]
sentry = [
    "sentry-sdk>=2.0",
]
oidc = [
    "mozilla-django-oidc>=5.0",
]

[project.urls]
Repository = "https://github.com/tclancy/abi-django-utils"

[tool.hatch.build.targets.wheel]
packages = ["src/abi_django_utils"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=abi_django_utils --cov-report=term-missing"

[tool.coverage.run]
source = ["src/abi_django_utils"]

[dependency-groups]
dev = [
    "mozilla-django-oidc>=5.0",
    "pre-commit>=4.2.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9.0",
    "ruff>=0.15.12",
    "sentry-sdk>=2.0",
]
